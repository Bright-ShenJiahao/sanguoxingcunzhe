<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三国幸存者 · 无名之辈外传</title>

<style>
:root{--bg:#EEF2EA;--fg:#1E2823;--muted:#5C6B62;--line:#CCD8CF;--on:#3c6d5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171A;--fg:#E4EAE6;--muted:#97A59D;--line:#2A3630;--on:#5a9a84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171A;--fg:#E4EAE6;--muted:#97A59D;--line:#2A3630;--on:#5a9a84;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0;letter-spacing:.04em}
p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.stage{position:relative;container-type:inline-size;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#8fb25a;touch-action:none;aspect-ratio:480/300;user-select:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
#kc{position:absolute;left:1.5cqw;top:1.5cqw;background:#33492a;color:#f2f7f3;border:.4cqw solid #e8f1ec;border-radius:.9cqw;font-size:2cqw;font-weight:600;padding:.6cqw 1.6cqw}
#mm{position:absolute;right:1.5cqw;top:1.5cqw;width:14cqw;height:auto;aspect-ratio:var(--mma,1);border:.4cqw solid #e8f1ec;border-radius:.6cqw;background:#222}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{font:inherit;font-size:14px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.sw button[aria-pressed=true]{background:var(--on);color:#fff;border-color:var(--on)}
.hint{font-size:13px;color:var(--muted)}
body.survival-playing{padding:0;overflow:hidden}
.survival-playing .wrap>:not(#st){display:none}
.survival-playing #st{position:fixed;inset:0;width:100%;height:100%;border:0;border-radius:0;aspect-ratio:auto}
.survival-playing #mm{width:min(22cqw,40vmin,280px);height:auto}
.survival-playing #kc{font-size:clamp(12px,2cqw,18px)}
body.loading{background:#07101b}body.loading .wrap{visibility:hidden}
#boot{position:fixed;inset:0;z-index:60;overflow:hidden;background:#07101b;transition:opacity .5s}
#boot .bg{position:absolute;inset:0;background:url(assets/map/boot.jpg) repeat-x 0 0/auto 100%}
#boot::before{content:"";position:absolute;inset:0;z-index:2000;pointer-events:none;background:linear-gradient(180deg,#07101b99,#07101b44 45%,#07101bbb)}
#boot .sd{position:absolute;left:0;image-rendering:pixelated;transform-origin:50% 100%;will-change:transform}
#boot .tx{position:absolute;left:0;right:0;bottom:9vh;z-index:2100;text-align:center;color:#c9d8e8;font-size:15px;letter-spacing:.35em}
#boot .bar{position:absolute;left:50%;bottom:5vh;z-index:2100;width:min(320px,60vw);height:4px;margin-left:calc(min(320px,60vw)/-2);background:#ffffff22;border-radius:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:4%;background:#f0d58a;transition:width .25s}
#bx{position:absolute;z-index:2200;display:flex;gap:14px;align-items:center;box-sizing:border-box;width:min(440px,90vw);padding:14px 18px 14px 14px;background:#101a3a;border:4px solid #f4f4f4;box-shadow:0 0 0 4px #101a3a,0 0 0 7px #8aa6e0,0 8px 24px #000a;color:#fff;font:700 17px/1.65 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:.08em;opacity:0;transition:opacity .2s}
#bx.on{opacity:1}
#bx canvas{flex:none;width:84px;height:75px;image-rendering:pixelated;border:3px solid #f4f4f4;background:linear-gradient(#3b5ba8,#22306a)}
#bx p{margin:0;color:#fff;font-size:inherit;min-height:3.3em}
#bx i{position:absolute;right:12px;bottom:6px;font-style:normal;font-size:12px;animation:bk .7s steps(2) infinite}
#bx::after{content:"";position:absolute;left:var(--tail,50%);bottom:-17px;margin-left:-9px;border:9px solid transparent;border-top:9px solid #f4f4f4;border-bottom:0}
@keyframes bk{50%{opacity:0}}
</style></head><body class="loading">
<div id="boot"><div class="bg" id="bbg"></div><div id="bx"><canvas id="bxa" width="28" height="25"></canvas><p id="bxt"></p><i>▼</i></div><div class="tx">加载中…</div><div class="bar"><i id="bootbar"></i></div></div>
<script>
(function(){var b=document.getElementById('boot');if(!b)return;
var P='assets/characters/',K=innerHeight>=900?3:2,W=innerWidth,H=innerHeight,hb=Math.round(H*.27),hx=Math.round(W*(W<700?.7:.62));
var kinds=['grunt_club','blade','spear','shield','archer'],L=[],lane=[-26,18,-8,30,0,-30,14,24,-14,4];
function fr(dir,pre,from,to){var a=[];for(var j=from;j<=to;j++){var im=new Image();im.src=P+dir+'/'+pre+j+'.png';a.push(im.src)}return a}
function mk(f,bot,z,x,v,ph,fps){var el=document.createElement('img');el.className='sd';el.style.bottom=bot+'px';el.style.zIndex=z;b.appendChild(el);return {el:el,f:f,x:x,v:v,ph:ph,fps:fps,bot:bot}}
var hero=mk(fr('hero_b','w',2,7),hb,1000-hb,hx,0,0,85);
for(var i=0;i<10;i++){var bt=hb+lane[i]*K/2;L.push(mk(fr('enemies/'+kinds[i>>1],'walk',0,5),bt,1000-bt,hx-(110+(i>>1)*70+(i&1)*38)*K/2,0,i,95))}
var tp=document.getElementById('bx'),tt=document.getElementById('bxt'),T='我刚才不是在家里打游戏吗！？',t0=performance.now();
var av=new Image();av.onload=function(){var c=document.getElementById('bxa').getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(av,6,0,28,25,0,0,28,25)};av.src=P+'hero_b/w0.png';
var bw=Math.min(440,W*.9),bl=Math.max(12,Math.min(hx-bw/2,W-bw-12));tp.style.left=bl+'px';tp.style.bottom=(hb+50*K+26)+'px';tp.style.setProperty('--tail',(hx-bl)+'px');
var bgw=H*3.2,last=t0;
function tick(n){if(!document.getElementById('boot'))return;var t=(n-t0)/1000,dt=Math.min(.05,(n-last)/1000);last=n;
document.getElementById('bbg').style.backgroundPositionX=-Math.round((t*180*K/2)%bgw)+'px';
hero.el.src=hero.f[Math.floor(n/hero.fps)%6];hero.el.style.transform='translateX('+(hero.x-18*K)+'px) scale('+K+')';
for(var i=0;i<L.length;i++){var o=L[i],sx=o.x+Math.sin(t*2.1+i*1.7)*16*K/2;o.el.src=o.f[Math.floor(n/o.fps+i)%6];o.el.style.transform='translateX('+Math.round(sx-17*K)+'px) scale('+K+')'}
if(t>.35){tp.className='on';var k=Math.min(T.length,Math.floor((t-.35)/.075));tt.textContent=T.slice(0,k)}
requestAnimationFrame(tick)}requestAnimationFrame(tick)})();
</script>
<div class="wrap">
<div class="stage" id="st"><canvas id="cv" width="960" height="600" aria-label="写实俯瞰风野外地图，小兵挥刀斩敌"></canvas><div id="kc">斩敌 0</div><canvas id="mm" width="84" height="84"></canvas></div>
<div class="sw" role="group" aria-label="角色" id="cs"><button data-c="m" aria-pressed="true">男主</button><button data-c="m1" aria-pressed="false">男主·光头</button><button data-c="m2" aria-pressed="false">男主·短寸</button><button data-c="m3" aria-pressed="false">男主·束发</button><button data-c="m4" aria-pressed="false">男主·高马尾</button><button data-c="m5" aria-pressed="false">男主·爆炸头</button><button data-c="f0" aria-pressed="false">女主·长直发</button><button data-c="f1" aria-pressed="false">女主·短发</button><button data-c="f2" aria-pressed="false">女主·卷发</button><button data-c="f3" aria-pressed="false">女主·红发带</button><button data-c="f4" aria-pressed="false">女主·丸子头</button><button data-c="f5" aria-pressed="false">女主·双丸子</button></div>
</div>

<script type="module" src="src/main.js"></script>
</body></html>
