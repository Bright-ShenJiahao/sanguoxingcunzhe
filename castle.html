<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>城堡战争（试做）· 异世界幸存者</title>
<style>
html,body{margin:0;height:100%;background:#0d1612;color:#f2efe4;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;touch-action:none}
#cv{position:absolute;left:0;top:0;image-rendering:auto}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:14px;align-items:center;padding:6px 12px;background:#0d1612cc;font-size:15px;z-index:2}
#top b{color:#f3d27a}#top .r{margin-left:auto;color:#ffb3a0}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px;background:#0d1612dd;overflow-x:auto;z-index:2}
#bar button{flex:none;min-width:74px;font:inherit;font-size:13px;line-height:1.3;padding:4px 8px;border-radius:6px;border:1px solid #5b6f63;background:#1d2b24;color:#f2efe4;cursor:pointer}
#bar button img{display:block;height:28px;margin:0 auto 2px;image-rendering:pixelated}
#bar button.on{background:#3c6d5c;border-color:#9fd3bd}
#bar button:disabled{opacity:.45}
#bar small{color:#f3d27a}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000a;z-index:3;font-size:28px}
#msg button{font:inherit;font-size:16px;padding:8px 22px;border-radius:6px;border:0;background:#3c6d5c;color:#fff}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><span>金币 <b id="gold">0</b></span><span>收入 <b id="inc">0</b>/10秒</span><span id="tip">选建筑，再点左边的空格子</span><span class="r" id="ehp"></span></div>
<div id="bar"></div>
<div id="msg"><div id="msgt"></div><button onclick="location.reload()">再来一局</button></div>
<script src="src/castle.js"></script>
</body></html>
